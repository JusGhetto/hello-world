<html>
    <head>
        <link rel="stylesheet" href="style.css">
                
    </head>
    ,<body>
        <label for="weather">What's the weather like?</label>
        <select id="weather">
            <option value="sunny">Sunny</option>
            <option value="rainy">Rainy</option>
            <option value="cloudy">Cloudy</option>
            <option value="snowy">Snowy</option>
            <option value="windy">Windy</option>
            <option value="foggy">Foggy</option>
            <option value="stormy">Stormy</option>
            <option value="hail">Hail</option>
            <option value="thunderstorm">Thunderstorm</option>
            <option value="tornado">Tornado</option>
        </select>
        <a href="#" onclick="btnPressed()">GO!</a>
        <p id="outputText">Weather advice: </p>
        <script>
            function btnPressed() {
                var weatherSelected = document.getElementById("weather").value;
                var advice;

                switch (weatherSelected){
                    case "sunny":
                        advice = "Wear sunglasses and sunscreen.";
                        break;
                    case "rainy":
                        advice = "Take an umbrella.";
                        break;
                    case "cloudy":
                        advice = "It might rain, so be prepared.";
                        break;
                    case "snowy":
                        advice = "Wear warm clothes and boots.";
                        break;
                    case "windy":
                        advice = "Hold onto your hat!";
                        break;
                    case "foggy":
                        advice = "Drive carefully and use fog lights.";
                        break;
                    case "stormy":
                        advice = "Stay indoors and avoid windows.";
                        break;
                    case "hail":
                        advice = "Seek shelter to avoid getting hurt.";
                        break;
                    case "thunderstorm":
                        advice = "Avoid using electrical appliances.";
                        break;
                    case "tornado":
                        advice = "Find a safe place in a basement or interior room.";
                        break;
                    default:
                        advice = "Weather not recognized. Stay safe!";
                } 
                document.getElementById("outputText").innerHTML = "Weather advice: " + advice;
            }
        </script>
    </body>
    
</html>
