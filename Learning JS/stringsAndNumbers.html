<html>
<head>
    <title>Strings and Numbers</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <p id="outputText"></p>  
    <script>
        var text1 = "ten";
        var text2 = "5";

        var number1 = stringToNumber(text1);
        var number2 = stringToNumber(text2);

        if (isNaN(number1) || isNaN(number2)) {
            document.getElementById("outputText").innerHTML = "One or both of the inputs are not valid numbers.";
        } else {
            document.getElementById("outputText").innerHTML = number1 + number2;
        }

        document.getElementById("outputText").innerHTML = number1 + number2;

        function stringToNumber(text){
            return parseInt(text);
        } 

    </script>
</body>      
</html>
